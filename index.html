<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涵養庵 お道具取り合わせ帖 v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');
:root { --ink:#1a1208; --ink-l:#4a3f2f; --paper:#f5f0e8; --paper-d:#ede5d4; --gold:#8b6914; --gold-l:#c9a84c; --gold-p:#f0e4b8; --red:#8b2020; --red-l:#c94040; --green:#2d4a2d; --green-l:#e2efda; --border:#c8b89a; --shadow:rgba(26,18,8,.12); }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif JP',serif;background:var(--paper);color:var(--ink);min-height:100vh;background-image:radial-gradient(ellipse at 20% 10%,rgba(200,184,154,.3) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(139,105,20,.08) 0%,transparent 50%)}
header{background:var(--ink);color:var(--paper);padding:16px 20px 12px;position:sticky;top:0;z-index:200;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;}
.hd-btn{background:transparent;border:1px solid var(--gold-l);color:var(--gold-l);padding:5px 12px;border-radius:3px;font-size:11px;cursor:pointer;}
.tabs{display:flex;background:var(--paper-d);border-bottom:2px solid var(--border);overflow-x:auto;}
.tab{padding:11px 18px;font-size:12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.main{max-width:820px;margin:0 auto;padding:20px 14px 60px}
.panel{display:none}.panel.active{display:block}
.sec{background:#fff;border:1px solid var(--border);border-radius:4px;margin-bottom:16px;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
.sec-hd{background:var(--paper-d);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec-body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink-l);}
.field input, .field textarea{border:1px solid var(--border);border-radius:3px;padding:7px 9px;font-size:13px;background:var(--paper);}
.btn-primary{background:var(--red);color:#fff;border:none;padding:11px 22px;border-radius:3px;cursor:pointer;font-weight:500;}
</style>
</head>
<body>
<header>
  <div class="hd-title"><h1>涵養庵 お道具取り合わせ帖 <span>v3</span></h1></div>
  <div style="display:flex;gap:6px">
    <button class="hd-btn" onclick="exportBackup()">💾 保存</button>
    <button class="hd-btn" onclick="document.getElementById('importFile').click()">📂 復元</button>
  </div>
</header>
<div class="tabs">
  <div class="tab active" onclick="switchTab('input')">✍ 月別入力</div>
  <div class="tab" onclick="switchTab('report')">📃 原稿生成</div>
</div>
<div class="main">
  <div class="panel active" id="panel-input">
    <div class="sec">
      <div class="sec-hd"><div class="sec-title">基本情報</div></div>
      <div class="sec-body" style="grid-template-columns:1fr;"><div class="field"><label>月タイトル</label><input type="text" id="monthTitle" placeholder="例：令和７年師走のお稽古"/></div></div>
    </div>
    <div id="lessonContainer"></div>
    <button class="btn-primary" onclick="addLesson()" style="background:var(--blue); margin-bottom:20px;">＋ 稽古回数を追加</button>
    <div class="action-bar"><button class="btn-primary" onclick="generateReport()">✦ 原稿生成</button></div>
  </div>
</div>
<script>
let lessonCount = 0;
function addLesson() {
  lessonCount++;
  const div = document.createElement('div');
  div.className = 'sec';
  div.innerHTML = `
    <div class="sec-hd"><div class="sec-title">第 ${lessonCount} 回目</div></div>
    <div class="sec-body">
      <div class="field"><label>掛物</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>花入</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>香合</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>釜</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>風炉・炉</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>水指</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>茶入</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>茶杓</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>主茶碗</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field"><label>替茶碗</label><input type="text" class="l-${lessonCount}-item"></div>
      <div class="field" style="grid-column: span 2;"><label>備考</label><textarea rows="2" class="l-${lessonCount}-item"></textarea></div>
    </div>`;
  document.getElementById('lessonContainer').appendChild(div);
}
addLesson(); // 初期表示で1回分
function switchTab(name) { /* タブ切替ロジック */ }
</script>
</body>
</html>
