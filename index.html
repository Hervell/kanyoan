<header>
  <div class="hd-title">
    <div class="hd-crest">茶</div>
    <h1>涵養庵 お道具取り合わせ帖<span>KANYOAN — v3</span></h1>
  </div>
  <div style="display:flex;gap:6px">
    <button class="hd-btn" onclick="sendArticleReport()" style="background:var(--blue); color:#fff; border-color:var(--blue);" title="記事の完成を報告する">
      📢 記事作成を報告
    </button>
    <button class="hd-btn" onclick="exportBackup()">💾 保存</button>
    <button class="hd-btn" onclick="document.getElementById('importFile').click()">📂 復元</button>
  </div>
</header>

<script>
function sendArticleReport() {
  const month = document.getElementById('monthTitle').value || "今月";
  const today = new Date().toLocaleDateString('ja-JP');
  
  const subject = encodeURIComponent(`【報告】涵養庵：${month}のコラム記事を作成しました`);
  const body = encodeURIComponent(
    `関係者各位\n\nお疲れ様です。手島です。\n本日（${today}）、涵養庵のサイトにて「${month}」のコラム記事・お道具取り合わせ帖の更新が完了しました。\n\n内容の確認をお願いいたします。\n\nサイトURL: https://hervell.github.io/kanyoan/`
  );

  // 報告先は ops@hervell.co.jp
  window.location.href = `mailto:ops@hervell.co.jp?subject=${subject}&body=${body}`;
  
  if(typeof showToast === 'function') {
    showToast('報告メールを起動しました');
  }
}
</script>
