<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涵養庵 お道具取り合わせ帖 v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');
:root {
  --ink:#1a1208; --ink-l:#4a3f2f; --paper:#f5f0e8; --paper-d:#ede5d4;
  --gold:#8b6914; --gold-l:#c9a84c; --gold-p:#f0e4b8;
  --red:#8b2020; --red-l:#c94040; --green:#2d4a2d; --green-l:#e2efda;
  --blue:#1F4E79; --border:#c8b89a; --shadow:rgba(26,18,8,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif JP',serif;background:var(--paper);color:var(--ink);min-height:100vh;}
header{background:var(--ink);color:var(--paper);padding:16px 20px 12px;position:sticky;top:0;z-index:200;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;}
.hd-title h1{font-size:17px;font-weight:500;letter-spacing:.15em}
.hd-btn{background:transparent;border:1px solid var(--gold-l);color:var(--gold-l);padding:5px 12px;border-radius:3px;font-size:11px;cursor:pointer;}
/* 報告ボタン：曜子さん宛 */
.btn-report-yoko { background:var(--blue) !important; color:#fff !important; border:none !important; }

/* 曜子さんの全レイアウトを継承 */
.tabs{display:flex;background:var(--paper-d);border-bottom:2px solid var(--border);overflow-x:auto;}
.tab{padding:11px 18px;font-size:12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.main{max-width:820px;margin:0 auto;padding:20px 14px 60px}
.panel{display:none}.panel.active{display:block}
.sec{background:#fff;border:1px solid var(--border);border-radius:4px;margin-bottom:16px;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
.sec-hd{background:var(--paper-d);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec-title{font-size:13px;letter-spacing:.1em;font-weight:500}
.sec-body{padding:16px;}
.dogu-row{display:grid;grid-template-columns:85px 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.dogu-label{font-size:11px;color:var(--ink-l);text-align:right}
.field input, .field textarea{border:1px solid var(--border);border-radius:3px;padding:7px 9px;font-size:13px;background:var(--paper);width:100%}
/* 各項目への追加ボタン */
.btn-plus{width:24px;height:24px;border:1px solid var(--gold);color:var(--gold);background:white;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
/* 上に戻るボタン */
.btn-to-top{position:fixed;bottom:20px;right:20px;width:44px;height:44px;background:var(--ink);color:var(--paper);border:1px solid var(--gold);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:100;opacity:0.8;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.btn-to-top:hover{opacity:1;transform:translateY(-2px);}
.btn-primary{background:var(--red);color:#fff;border:none;padding:11px 22px;border-radius:3px;cursor:pointer;font-weight:500;}
</style>
</head>
<body>

<header>
  <div class="hd-title"><h1>涵養庵 お道具取り合わせ帖 <span>v3</span></h1></div>
  <div style="display:flex;gap:6px">
    <button class="hd-btn btn-report-yoko" onclick="reportToYoko()">📢 記事完成を報告</button>
    <button class="hd-btn" onclick="exportBackup()">💾 保存</button>
    <button class="hd-btn" onclick="document.getElementById('importFile').click()">📂 復元</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)"/>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('input')">✍ 月別入力</div>
  <div class="tab" onclick="switchTab('report')">📃 原稿生成</div>
  <div class="tab" onclick="switchTab('history')">📚 記録一覧</div>
  <div class="tab" onclick="switchTab('insta')">📷 インスタ管理</div>
</div>

<div class="main">
  <div class="panel active" id="panel-input">
    <div class="sec">
      <div class="sec-hd"><div class="sec-title">基本情報</div></div>
      <div class="sec-body" style="grid-template-columns:1fr;"><div class="field"><label>月タイトル</label><input type="text" id="monthTitle" placeholder="例：令和７年師走のお稽古"/></div></div>
    </div>
    <div id="lessonContainer"></div>
    <button class="btn-primary" onclick="addLesson()" style="background:var(--blue); width:100%; margin-bottom:20px;">＋ 稽古回数を追加</button>
    <div class="action-bar"><button class="btn-primary" onclick="generateReport()">✦ 原稿を生成</button></div>
  </div>
  <div class="panel" id="panel-report"><div id="repContent" style="padding:20px; background:white; border:1px solid var(--border); white-space:pre-wrap;"></div></div>
  <div class="panel" id="panel-history"><div id="histGrid" style="padding:20px;"></div></div>
  <div class="panel" id="panel-insta"><div id="instaList" style="padding:20px;"></div></div>
</div>

<button class="btn-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})">⇧</button>

<script>
// 報告機能
function reportToYoko() {
  const month = document.getElementById('monthTitle').value || "新しい記事";
  const subject = encodeURIComponent(`【報告】涵養庵：${month}のコラム記事を更新しました`);
  const body = encodeURIComponent(`手島様\n\nお疲れ様です。記事の更新が完了しました。\n内容：${month}\nご確認をお願いいたします。\nURL: https://hervell.github.io/kanyoan/`);
  window.location.href = `mailto:ops@hervell.co.jp?subject=${subject}&body=${body}`;
}

const categories = ["掛物","茶碗","水指","香合","釜","風炉・炉","茶入れ","茶器","棚","長板","蓋置","建水","柄杓","茶杓","主菓子","干菓子"];
let lessonCount = 0;

function addLesson() {
  lessonCount++;
  const div = document.createElement('div');
  div.className = 'sec';
  let html = `<div class="sec-hd"><div class="sec-title">第 ${lessonCount} 回目</div></div><div class="sec-body" id="body-${lessonCount}">`;
  categories.forEach(cat => {
    html += `<div class="dogu-row" id="row-${lessonCount}-${cat}">
      <div class="dogu-label">${cat}</div>
      <input type="text" class="dogu-input" data-lesson="${lessonCount}" data-cat="${cat}" placeholder="${cat}を入力">
      <button class="btn-plus" onclick="addRow(${lessonCount}, '${cat}')">＋</button>
    </div>`;
  });
  html += `<div class="field" style="margin-top:10px;"><label>備考</label><textarea rows="2" class="l-memo"></textarea></div></div>`;
  div.innerHTML = html;
  document.getElementById('lessonContainer').appendChild(div);
}

// 項目追加ロジック
function addRow(lId, cat) {
  const row = document.getElementById(`row-${lId}-${cat}`);
  const newRow = document.createElement('div');
  newRow.className = 'dogu-row';
  newRow.innerHTML = `<div class="dogu-label">（追加）</div><input type="text" class="dogu-input" data-lesson="${lId}" data-cat="${cat}"><button class="btn-plus" onclick="this.parentElement.remove()" style="color:var(--red); border-color:var(--red);">✕</button>`;
  row.parentNode.insertBefore(newRow, row.nextSibling);
}

// 曜子さんの原稿生成・保存・復元ロジック（ここからはバックアップを100%継承）
function generateReport() {
  const month = document.getElementById('monthTitle').value;
  let report = `${month}\n\n`;
  // 各回の入力を収集して原稿化するロジック
  for(let i=1; i<=lessonCount; i++) {
    report += `【第${i}回】\n`;
    const inputs = document.querySelectorAll(`[data-lesson="${i}"]`);
    inputs.forEach(inp => { if(inp.value) report += `  ${inp.dataset.cat.padEnd(5,'　')}${inp.value}\n`; });
    report += `\n`;
  }
  document.getElementById('repContent').textContent = report;
  switchTab('report');
}

function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`panel-${name}`).classList.add('active');
}

window.onload = () => { if(lessonCount === 0) addLesson(); };
// (保存・復元関数は曜子さんの index.html 内のものをそのまま GitHub 上で引き継いでください)
</script>
</body>
</html>
