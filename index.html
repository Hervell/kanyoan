<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>涵養庵 お道具取り合わせ帖 v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');
:root {
  --ink:#1a1208; --ink-l:#4a3f2f; --paper:#f5f0e8; --paper-d:#ede5d4;
  --gold:#8b6914; --gold-l:#c9a84c; --gold-p:#f0e4b8;
  --red:#8b2020; --red-l:#c94040; --green:#2d4a2d; --green-l:#e2efda;
  --blue:#1F4E79; --blue-l:#d6e4f0; --purple:#4a2060; --purple-l:#ede4f5;
  --border:#c8b89a; --shadow:rgba(26,18,8,.12);
  --insta:#e1306c; --insta-l:#fce4ee;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Serif JP',serif;background:var(--paper);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(200,184,154,.3) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(139,105,20,.08) 0%,transparent 50%)}

/* HEADER */
header{background:var(--ink);color:var(--paper);padding:16px 20px 12px;position:sticky;top:0;z-index:200;
  border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px var(--shadow)}
.hd-title{display:flex;align-items:center;gap:10px}
.hd-crest{width:34px;height:34px;border:2px solid var(--gold-l);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold-l);flex-shrink:0}
h1{font-size:17px;font-weight:500;letter-spacing:.15em}
h1 span{font-size:10px;display:block;color:var(--gold-l);letter-spacing:.2em;margin-top:2px;font-weight:300}
.hd-btn{background:transparent;border:1px solid var(--gold-l);color:var(--gold-l);padding:5px 12px;border-radius:3px;
  font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;letter-spacing:.1em;transition:all .2s}
.hd-btn:hover{background:var(--gold);color:var(--paper);border-color:var(--gold)}

/* TABS */
.tabs{display:flex;background:var(--paper-d);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 18px;font-size:12px;cursor:pointer;white-space:nowrap;letter-spacing:.1em;
  border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--ink-l);transition:all .2s;font-family:'Noto Sans JP',sans-serif}
.tab:hover{color:var(--ink);background:rgba(139,105,20,.06)}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:500}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;
  font-family:'Noto Sans JP',sans-serif;margin-left:5px;vertical-align:middle}

/* MAIN */
.main{max-width:820px;margin:0 auto;padding:20px 14px 60px}
.panel{display:none}.panel.active{display:block}
.deco{height:3px;background:linear-gradient(90deg,var(--red) 0%,var(--gold) 50%,var(--red) 100%);margin:0 0 20px;border-radius:2px}

/* SECTION */
.sec{background:#fff;border:1px solid var(--border);border-radius:4px;margin-bottom:16px;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
.sec-hd{background:var(--paper-d);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sec-kanji{font-size:20px;color:var(--gold);font-weight:300;line-height:1;flex-shrink:0}
.sec-title{font-size:13px;letter-spacing:.1em;font-weight:500}
.sec-body{padding:14px 16px}

/* MONTH META */
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.meta-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--ink-l);letter-spacing:.12em;font-family:'Noto Sans JP',sans-serif}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:3px;padding:7px 9px;
  font-family:'Noto Serif JP',serif;font-size:13px;background:var(--paper);color:var(--ink);transition:border-color .2s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(139,105,20,.1)}
.field textarea{resize:vertical;min-height:70px;line-height:1.8}

/* SESSION TABS */
.session-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.s-tab{background:var(--paper-d);border:1px solid var(--border);border-radius:3px;padding:5px 12px;
  font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;letter-spacing:.08em;transition:all .2s;color:var(--ink-l)}
.s-tab.active{background:var(--red);color:#fff;border-color:var(--red);font-weight:500}
.s-tab:hover:not(.active){border-color:var(--gold);color:var(--gold)}
.btn-add-session{background:none;border:1px dashed var(--border);border-radius:3px;padding:5px 10px;
  font-size:12px;cursor:pointer;color:var(--ink-l);font-family:'Noto Sans JP',sans-serif;transition:all .2s}
.btn-add-session:hover{border-color:var(--gold);color:var(--gold)}
.btn-del-session{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:0 0 0 4px;transition:color .15s;line-height:1}
.btn-del-session:hover{color:var(--red)}
.session-panel{display:none}.session-panel.active{display:block}

/* DOGU LIST */
.dogu-list{display:flex;flex-direction:column;gap:7px}
.dogu-row{display:grid;grid-template-columns:82px 1fr auto;gap:7px;align-items:start}
.dogu-label{font-size:11px;color:var(--ink-l);letter-spacing:.06em;text-align:right;padding-right:5px;
  font-family:'Noto Sans JP',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:8px}
.dogu-input-wrap{display:flex;flex-direction:column;gap:5px}
.dogu-input-row{display:flex;gap:5px;align-items:center}
.dogu-sub-rows{display:flex;flex-direction:column;gap:5px}
.dogu-sub-row{display:flex;gap:5px;align-items:center}
.dogu-select,.dogu-text{flex:1;border:1px solid var(--border);border-radius:3px;padding:6px 7px;
  font-family:'Noto Serif JP',serif;font-size:12px;background:var(--paper);color:var(--ink);transition:border-color .2s}
.dogu-select:focus,.dogu-text:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(139,105,20,.1)}
.dogu-text{display:none;flex:.8}.dogu-text.show{display:block}
.btn-addrow{background:none;border:1px dashed var(--border);border-radius:3px;width:26px;height:26px;
  cursor:pointer;color:var(--ink-l);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.btn-addrow:hover{border-color:var(--gold);color:var(--gold)}
.btn-remove{background:none;border:none;cursor:pointer;color:#bbb;font-size:15px;padding:0;line-height:1;
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:color .15s;flex-shrink:0}
.btn-remove:hover{color:var(--red)}
.toggle-free{font-size:10px;color:var(--gold);cursor:pointer;background:none;border:1px solid var(--gold-p);
  border-radius:2px;padding:2px 4px;letter-spacing:.04em;transition:all .15s;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;flex-shrink:0}
.toggle-free:hover{background:var(--gold-p)}
.divider{border:none;border-top:1px dashed var(--border);margin:10px 0}

/* BORROWED ITEMS */
.borrowed-sec{background:var(--purple-l);border:1px solid #c4aee0;border-radius:4px;margin-bottom:16px;overflow:hidden}
.borrowed-hd{background:#6a3090;padding:10px 16px;display:flex;align-items:center;gap:8px}
.borrowed-hd-text{font-size:13px;font-weight:500;color:#fff;letter-spacing:.1em}
.borrowed-body{padding:14px 16px}
.borrowed-list{display:flex;flex-direction:column;gap:8px}
.borrowed-row{display:grid;grid-template-columns:1fr 130px 130px 28px;gap:7px;align-items:center}
@media(max-width:560px){.borrowed-row{grid-template-columns:1fr 1fr;}.borrowed-row input[type=date]{grid-column:1/-1}}
.borrowed-input{border:1px solid #c4aee0;border-radius:3px;padding:6px 8px;font-family:'Noto Serif JP',serif;
  font-size:12px;background:#fff;color:var(--ink);width:100%}
.borrowed-input:focus{outline:none;border-color:#6a3090;box-shadow:0 0 0 2px rgba(106,48,144,.15)}
.borrowed-label{font-size:11px;color:var(--purple);font-family:'Noto Sans JP',sans-serif;margin-bottom:2px;display:block}
.btn-add-borrowed{background:none;border:1px dashed #c4aee0;border-radius:3px;padding:7px 14px;
  font-size:12px;cursor:pointer;color:#6a3090;font-family:'Noto Sans JP',sans-serif;margin-top:8px;transition:all .2s;width:100%;text-align:center}
.btn-add-borrowed:hover{border-color:#6a3090;background:rgba(106,48,144,.06)}

/* AUTOCOMPLETE */
.ac-wrap{position:relative;flex:1}
.ac-input{width:100%;border:1px solid var(--border);border-radius:3px;padding:6px 26px 6px 7px;
  font-family:'Noto Serif JP',serif;font-size:12px;background:var(--paper);color:var(--ink);transition:border-color .2s;box-sizing:border-box}
.ac-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(139,105,20,.1)}
.ac-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:500;background:#fff;
  border:1px solid var(--gold);border-top:none;border-radius:0 0 4px 4px;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px var(--shadow)}
.ac-dropdown.open{display:block}
.ac-item{padding:6px 9px;font-size:12px;font-family:'Noto Serif JP',serif;cursor:pointer;color:var(--ink);
  border-bottom:1px solid var(--paper-d);transition:background .1s}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.sel{background:var(--gold-p)}
.ac-item mark{background:none;color:var(--red);font-weight:bold}
.ac-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:13px;line-height:1;padding:0;display:none}
.ac-clear.show{display:block}

/* BUTTONS */
.action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:
