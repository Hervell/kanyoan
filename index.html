<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>涵養庵 お道具取り合わせ帖 v3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');
        :root {
            --ink:#1a1208; --ink-l:#4a3f2f; --paper:#f5f0e8; --paper-d:#ede5d4;
            --gold:#8b6914; --gold-l:#c9a84c; --gold-p:#f0e4b8;
            --red:#8b2020; --red-l:#c94040; --green:#2d4a2d; --green-l:#e2efda;
            --blue:#1F4E79; --blue-l:#d6e4f0; --purple:#4a2060; --purple-l:#ede4f5;
            --border:#c8b89a; --shadow:rgba(26,18,8,.12);
            --insta:#e1306c; --insta-l:#fce4ee;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Noto Serif JP',serif;background:var(--paper);color:var(--ink);min-height:100vh;background-image:radial-gradient(ellipse at 20% 10%,rgba(200,184,154,.3) 0%,transparent 50%),radial-gradient(ellipse at 80% 90%,rgba(139,105,20,.08) 0%,transparent 50%)}
        header{background:var(--ink);color:var(--paper);padding:16px 20px 12px;position:sticky;top:0;z-index:200;border-bottom:3px solid var(--gold);display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px var(--shadow)}
        .hd-title{display:flex;align-items:center;gap:10px}
        .hd-crest{width:34px;height:34px;border:2px solid var(--gold-l);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold-l);flex-shrink:0}
        h1{font-size:17px;font-weight:500;letter-spacing:.15em}
        h1 span{font-size:10px;display:block;color:var(--gold-l);letter-spacing:.2em;margin-top:2px;font-weight:300}
        .hd-btn{background:transparent;border:1px solid var(--gold-l);color:var(--gold-l);padding:5px 12px;border-radius:3px;font-family:'Noto Sans JP',sans-serif;font-size:11px;cursor:pointer;letter-spacing:.1em;transition:all .2s}
        .hd-btn:hover{background:var(--gold);color:var(--paper);border-color:var(--gold)}
        .tabs{display:flex;background:var(--paper-d);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none}
        .tab{padding:11px 18px;font-size:12px;cursor:pointer;white-space:nowrap;letter-spacing:.1em;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--ink-l);transition:all .2s;font-family:'Noto Sans JP',sans-serif}
        .tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:500}
        .badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-family:'Noto Sans JP',sans-serif;margin-left:5px;vertical-align:middle}
        .main{max-width:820px;margin:0 auto;padding:20px 14px 60px}
        .panel{display:none}.panel.active{display:block}
        .deco{height:3px;background:linear-gradient(90deg,var(--red) 0%,var(--gold) 50%,var(--red) 100%);margin:0 0 20px;border-radius:2px}
        .sec{background:#fff;border:1px solid var(--border);border-radius:4px;margin-bottom:16px;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
        .sec-hd{background:var(--paper-d);padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
        .sec-kanji{font-size:20px;color:var(--gold);font-weight:300;line-height:1;flex-shrink:0}
        .sec-title{font-size:13px;letter-spacing:.1em;font-weight:500}
        .sec-body{padding:14px 16px}
        .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .field{display:flex;flex-direction:column;gap:4px}
        .field label{font-size:11px;color:var(--ink-l);letter-spacing:.12em;font-family:'Noto Sans JP',sans-serif}
        .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:3px;padding:7px 9px;font-family:'Noto Serif JP',serif;font-size:13px;background:var(--paper);color:var(--ink);transition:border-color .2s;width:100%}
        .field textarea{resize:vertical;min-height:70px;line-height:1.8}
        .session-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
        .s-tab{background:var(--paper-d);border:1px solid var(--border);border-radius:3px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;letter-spacing:.08em;transition:all .2s;color:var(--ink-l)}
        .s-tab.active{background:var(--red);color:#fff;border-color:var(--red);font-weight:500}
        .btn-add-session{background:none;border:1px dashed var(--border);border-radius:3px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-l);font-family:'Noto Sans JP',sans-serif;transition:all .2s}
        .btn-del-session{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:0 0 0 4px;transition:color .15s;line-height:1}
        .btn-del-session:hover{color:var(--red)}
        .dogu-list{display:flex;flex-direction:column;gap:7px}
        .dogu-row{display:grid;grid-template-columns:82px 1fr auto;gap:7px;align-items:start}
        .dogu-label{font-size:11px;color:var(--ink-l);letter-spacing:.06em;text-align:right;padding-right:5px;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:8px}
        .dogu-input-wrap{display:flex;flex-direction:column;gap:5px}
        .dogu-input-row{display:flex;gap:5px;align-items:center}
        .btn-addrow{background:none;border:1px dashed var(--border);border-radius:3px;width:26px;height:26px;cursor:pointer;color:var(--ink-l);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
        .btn-remove{background:none;border:none;cursor:pointer;color:#bbb;font-size:15px;padding:0;line-height:1;width:24px;height:24px;display:flex;align-items:center;justify-content:center;transition:color .15s;flex-shrink:0}
        .btn-remove:hover{color:var(--red)}
        .dogu-memo{border:1px dashed #c4aee0;border-radius:3px;padding:5px 7px;font-family:'Noto Serif JP',serif;font-size:11px;background:#faf8ff;color:#4a3f2f;width:100%;box-sizing:border-box}
        .ac-wrap{position:relative;flex:1}
        .ac-input{width:100%;border:1px solid var(--border);border-radius:3px;padding:6px 26px 6px 7px;font-family:'Noto Serif JP',serif;font-size:12px;background:var(--paper);color:var(--ink);transition:border-color .2s;box-sizing:border-box}
        .ac-input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(139,105,20,.1)}
        .ac-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:500;background:#fff;border:1px solid var(--gold);border-top:none;border-radius:0 0 4px 4px;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px var(--shadow)}
        .ac-dropdown.open{display:block}
        .ac-item{padding:6px 9px;font-size:12px;font-family:'Noto Serif JP',serif;cursor:pointer;color:var(--ink);border-bottom:1px solid var(--paper-d);transition:background .1s}
        .ac-item:hover,.ac-item.sel{background:var(--gold-p)}
        .ac-item mark{background:none;color:var(--red);font-weight:bold}
        .ac-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#aaa;font-size:13px;line-height:1;padding:0;display:none}
        .ac-clear.show{display:block}
        .action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
        .btn-primary{background:var(--red);color:#fff;border:none;padding:11px 22px;border-radius:3px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-size:13px;letter-spacing:.13em;font-weight:500;transition:all .2s;box-shadow:0 2px 8px rgba(139,32,32,.3)}
        .btn-primary:hover{background:var(--red-l);transform:translateY(-1px)}
        .btn-save{background:var(--green);color:#fff;border:none;padding:11px 18px;border-radius:3px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-size:12px;letter-spacing:.1em;transition:all .2s}
        .btn-save:hover{background:#3d6a3d;transform:translateY(-1px)}
        .divider{border:none;border-top:1px dashed var(--border);margin:10px 0}
        .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:4px;font-family:'Noto Sans JP',sans-serif;font-size:12px;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;letter-spacing:.1em;white-space:nowrap}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    </style>
</head>
<body>
    <header>
        <div class="hd-title"><div class="hd-crest">茶</div><h1>涵養庵 お道具取り合わせ帖<span>KANYOAN — v3</span></h1></div>
        <div style="display:flex;gap:6px">
            <button class="hd-btn" onclick="exportBackup()">💾 バックアップ</button>
            <button class="hd-btn" onclick="document.getElementById('importFile').click()">📂 復元</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)"/>
            <button class="hd-btn" onclick="newMonth()">＋ 新規</button>
        </div>
    </header>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('input')">✍ 月別入力</div>
        <div class="tab" onclick="switchTab('report')">📃 原稿生成</div>
        <div class="tab" onclick="switchTab('borrowed')">🔖 お借り物管理</div>
        <div class="tab" onclick="switchTab('history')">📚 記録一覧 <span class="badge" id="histBadge">0</span></div>
        <div class="tab" onclick="switchTab('insta')">📷 インスタ管理 <span class="badge" id="instaBadge">0</span></div>
    </div>
    <div class="main">
        <div class="panel active" id="panel-input">
            <div class="deco"></div>
            <div class="sec">
                <div class="sec-hd"><div class="sec-kanji">帖</div><div class="sec-title">月の基本情報</div></div>
                <div class="sec-body">
                    <div class="meta-grid">
                        <div class="field"><label>月タイトル（和暦）</label><input type="text" id="monthTitle" placeholder="例：令和７年師走十二月のお稽古"/></div>
                        <div class="field"><label>対象年月</label><input type="month" id="monthDate"/></div>
                        <div class="field" style="grid-column:1/-1"><label>今月の冒頭文</label><textarea id="monthIntro" placeholder="例：今年も残り少なくなってしまいました…"></textarea></div>
                        <div class="field" style="grid-column:1/-1"><label>今月の結び文</label><textarea id="monthOutro" placeholder="例：一年間ありがとうございました…"></textarea></div>
                    </div>
                </div>
            </div>
            <div class="sec">
                <div class="sec-hd"><div class="sec-kanji">回</div><div class="sec-title">お稽古回別入力</div></div>
                <div class="sec-body">
                    <div class="session-tabs" id="sessionTabs"></div>
                    <div id="sessionPanels"></div>
                    <div class="action-bar" style="margin-top:12px"><button class="hd-btn" onclick="addSession()">＋ 回を追加</button></div>
                </div>
            </div>
            <div class="action-bar">
                <button class="btn-primary" onclick="generateReport()">✦ 原稿を生成する</button>
                <button class="btn-save" onclick="saveRecord()">💾 記録として保存</button>
            </div>
        </div>
        <div class="panel" id="panel-report">
            <div class="sec-body" id="repContentA" style="white-space:pre-wrap; background:#fff; padding:20px; border:1px solid var(--border)"></div>
        </div>
        <div class="panel" id="panel-borrowed"></div>
        <div class="panel" id="panel-history"><div id="histGrid"></div></div>
        <div class="panel" id="panel-insta"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script>
        const MASTER_DATA = {"茶碗":["#1 萩焼 12代田原陶兵衛 安倍洋様","#11 大樋焼 大樋長兵衛 山崎智恵子様","#14 志野焼 春清 銘「山」近藤芙美子様"],"水指":["#1 木地釣瓶 北大路祥子様","#4 瀬戸焼 作平窯 銘「一重口」"],"掛物":[],"香合":[],"釜":[],"風炉":[],"炉縁":[],"炉壇":[],"茶器":[],"茶入れ":[],"薄茶":[],"濃茶":[],"花入れ":[],"花":[],"棚":[],"長板":[],"蓋置":[],"建水":[],"柄杓":[],"茶杓":[],"羽帚":[],"火箸":[],"釜鐶":[],"喰籠":[],"菓子器":[],"干菓子盆":[],"主菓子":[],"干菓子":[],"盆":[]};
        const INPUT_ORDER = ["掛物","茶碗","水指","香合","釜","風炉","炉縁","炉壇","茶器","茶入れ","薄茶","濃茶","花入れ","花","棚","長板","蓋置","建水","柄杓","茶杓","羽帚","火箸","釜鐶","喰籠","菓子器","干菓子盆","主菓子","干菓子","盆"];
        let sessions = []; let activeSession = 0; let records = JSON.parse(localStorage.getItem('kanyoan_records') || '[]');

        function init() { if (sessions.length === 0) addSession(); updateHistBadge(); }
        function addSession() {
            const id = Date.now();
            sessions.push({ id, label: `第${sessions.length + 1}回`, date: '', dogu: {} });
            renderSessionTabs(); setActiveSession(sessions.length - 1);
        }
        function renderSessionTabs() {
            const tabs = document.getElementById('sessionTabs'); tabs.innerHTML = '';
            sessions.forEach((s, i) => {
                const t = document.createElement('div'); t.className = 's-tab' + (i === activeSession ? ' active' : '');
                t.innerHTML = `${s.label}<button class="btn-del-session" onclick="deleteSession(${i}, event)">×</button>`;
                t.onclick = () => setActiveSession(i); tabs.appendChild(t);
            });
        }
        function setActiveSession(idx) {
            activeSession = idx; renderSessionTabs();
            const panels = document.getElementById('sessionPanels'); panels.innerHTML = '';
            const s = sessions[idx]; const p = document.createElement('div'); p.className = 'session-panel active';
            p.innerHTML = `<div class="dogu-list">${INPUT_ORDER.map(cat => `
                <div class="dogu-row">
                    <div class="dogu-label">${cat}</div>
                    <div class="dogu-input-wrap" id="wrap-${s.id}-${cat}">
                        <div class="dogu-input-row">${createAC(cat, s.id, 0)}</div>
                        <input type="text" class="dogu-memo" placeholder="${cat}のメモ..." oninput="updateData(${idx},'${cat}',0,'memo',this.value)" value="${(s.dogu[cat]?.[0]?.memo)||''}">
                    </div>
                    <button class="btn-addrow" onclick="addRow('${cat}',${s.id})">＋</button>
                </div>`).join('')}</div>`;
            panels.appendChild(p);
        }
        function createAC(cat, sid, rowIdx) {
            const val = (sessions.find(s=>s.id===sid).dogu[cat]?.[rowIdx]?.val) || '';
            return `<div class="ac-wrap"><input type="text" class="ac-input" placeholder="${cat}を検索..." oninput="handleAC(this,'${cat}',${sid},${rowIdx})" value="${val}"><div class="ac-dropdown"></div></div>`;
        }
        function handleAC(el, cat, sid, rowIdx) {
            const val = el.value; const sIdx = sessions.findIndex(s=>s.id===sid);
            if(!sessions[sIdx].dogu[cat]) sessions[sIdx].dogu[cat] = [];
            if(!sessions[sIdx].dogu[cat][rowIdx]) sessions[sIdx].dogu[cat][rowIdx] = {val:'',memo:''};
            sessions[sIdx].dogu[cat][rowIdx].val = val;
            const dd = el.nextElementSibling; const matches = (MASTER_DATA[cat] || []).filter(m => m.includes(val));
            if(val && matches.length) {
                dd.innerHTML = matches.map(m => `<div class="ac-item" onclick="selectAC(this,'${cat}',${sid},${rowIdx})">${m}</div>`).join('');
                dd.classList.add('open');
            } else { dd.classList.remove('open'); }
        }
        function selectAC(el, cat, sid, rowIdx) {
            const val = el.textContent; const sIdx = sessions.findIndex(s=>s.id===sid);
            sessions[sIdx].dogu[cat][rowIdx].val = val;
            const input = el.closest('.ac-wrap').querySelector('.ac-input'); input.value = val;
            el.closest('.ac-dropdown').classList.remove('open');
        }
        function updateData(sIdx, cat, rowIdx, field, val) {
            if(!sessions[sIdx].dogu[cat]) sessions[sIdx].dogu[cat] = [];
            if(!sessions[sIdx].dogu[cat][rowIdx]) sessions[sIdx].dogu[cat][rowIdx] = {val:'',memo:''};
            sessions[sIdx].dogu[cat][rowIdx][field] = val;
        }
        function switchTab(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(`panel-${name}`).classList.add('active');
            const idx = {input:0,report:1,borrowed:2,history:3,insta:4}[name];
            document.querySelectorAll('.tab')[idx].classList.add('active');
            if(name==='history') renderHistory();
        }
        function generateReport() {
            let res = `${document.getElementById('monthTitle').value}\n\n${document.getElementById('monthIntro').value}\n\n`;
            sessions.forEach(s => {
                res += `【${s.label}】\n`;
                INPUT_ORDER.forEach(cat => {
                    const entries = s.dogu[cat] || [];
                    entries.forEach(e => { if(e.val) res += `${cat}：${e.val}${e.memo?'（'+e.memo+'）':''}\n`; });
                });
                res += `\n`;
            });
            res += document.getElementById('monthOutro').value;
            document.getElementById('repContentA').textContent = res; switchTab('report');
        }
        function saveRecord() {
            const title = document.getElementById('monthTitle').value || '無題';
            records.unshift({ id:Date.now(), title, data: JSON.parse(JSON.stringify(sessions)) });
            localStorage.setItem('kanyoan_records', JSON.stringify(records)); updateHistBadge(); showToast('保存しました');
        }
        function updateHistBadge() { document.getElementById('histBadge').textContent = records.length; }
        function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
        init();
    </script>
</body>
</html>
